[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-tools"
version = "0.1.0"
description = "Look up YouTube video URLs from search queries via the YouTube Data API v3."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "laceto", email = "luigi.vinegar@gmail.com" }
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "openai>=1.0",
    "google-auth-oauthlib>=1.0",
    "kitai @ git+https://github.com/laceto/kitai.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
