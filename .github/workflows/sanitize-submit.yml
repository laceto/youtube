name: Sanitize tracklist - submit batch

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Submit sanitize batch job
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/submit_sanitize_batch.py

      - name: Commit job record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/richie_hawtin_sanitize_job.json
          git diff --cached --quiet || git commit -m "chore: submit richie hawtin sanitize batch job"
          git push
