name: Resolve Beatport tracks to YouTube

on:
  workflow_dispatch:
    inputs:
      input:
        description: "Beatport dump to resolve"
        default: "data/beatport/info_beatport_20261116.txt"
  schedule:
    # Daily, after the YouTube Data API quota resets (midnight Pacific = 07:00/08:00 UTC).
    # Each run searches at most 100 uncached tracks (100 units each = the 10,000/day free quota).
    # Once every track is cached the run is a no-op, so leftover days cost nothing.
    - cron: "0 9 * * *"

permissions:
  contents: write

env:
  INPUT: ${{ inputs.input || 'data/beatport/info_beatport_20261116.txt' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Count searches still needed
        id: plan
        run: |
          out=$(python scripts/resolve_beatport.py "$INPUT" --dry-run)
          echo "$out"
          if echo "$out" | grep -q ", 0 to search"; then
            echo "todo=false" >> "$GITHUB_OUTPUT"
          else
            echo "todo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve tracks (capped to the free daily quota)
        if: steps.plan.outputs.todo == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/resolve_beatport.py "$INPUT" --max-searches 100

      - name: Commit results
        if: steps.plan.outputs.todo == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/beatport/youtube_matches.xlsx "${INPUT%.txt}_youtube.xlsx"
          if git diff --cached --quiet; then
            echo "Nothing new. Nothing to commit."
          else
            git commit -m "data: resolve beatport tracks on YouTube ($(basename "$INPUT"))"
            git push
          fi
